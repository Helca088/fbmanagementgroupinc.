<div class="sidebar-backdrop" id="sidebarBackdrop"></div>
<script src="{% static 'js/page_loader.js' %}" defer></script>
<script>
(function () {
    var sidebar = document.getElementById('reportsSidebar');
    var toggle = document.getElementById('sidebarToggle');
    var backdrop = document.getElementById('sidebarBackdrop');
    var STORAGE_KEY = 'reportsSidebarCollapsed';

    if (!sidebar || !toggle || toggle.dataset.sidebarBound) {
        return; // already wired up, or elements missing
    }
    toggle.dataset.sidebarBound = 'true';

    function isMobile() {
        return window.matchMedia('(max-width: 768px)').matches;
    }

    function applyDesktopState() {
        var collapsed = localStorage.getItem(STORAGE_KEY) === 'true';
        sidebar.classList.toggle('collapsed', collapsed);
        toggle.setAttribute('aria-expanded', String(!collapsed));
    }

    if (!isMobile()) {
        applyDesktopState();
    }

    toggle.addEventListener('click', function () {
        if (isMobile()) {
            var open = sidebar.classList.toggle('mobile-expanded');
            if (backdrop) backdrop.classList.toggle('visible', open);
        } else {
            var collapsed = sidebar.classList.toggle('collapsed');
            localStorage.setItem(STORAGE_KEY, String(collapsed));
            toggle.setAttribute('aria-expanded', String(!collapsed));
        }
    });

    if (backdrop) {
        backdrop.addEventListener('click', function () {
            sidebar.classList.remove('mobile-expanded');
            backdrop.classList.remove('visible');
        });
    }
})();
</script>
